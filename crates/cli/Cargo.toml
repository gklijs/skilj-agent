[package]
name = "skilj-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = "1.0.229"
serde_json = "1.0.154"
skilj-agent-checks = { version = "0.1.0", path = "../checks" }
skilj-agent-index = { version = "0.1.0", path = "../index" }
skilj-agent-llm = { version = "0.1.0", path = "../llm" }
skilj-agent-tasks = { version = "0.1.0", path = "../tasks" }
tokio = { version = "1", features = ["rt", "macros"] }
