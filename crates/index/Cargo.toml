[package]
name = "skilj-agent-index"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
cargo_metadata = "0.23.1"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
toml = "1.1.8"
walkdir = "2.5.0"
